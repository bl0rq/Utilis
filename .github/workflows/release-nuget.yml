name: Release NuGet

on:
  workflow_dispatch:

jobs:
  release:
    if: github.ref == 'refs/heads/master'
    runs-on: windows-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Setup GitVersion
        uses: gittools/actions/gitversion/setup@v3
        with:
          versionSpec: 6.x

      - name: Compute Version
        id: gitversion
        uses: gittools/actions/gitversion/execute@v3

      - name: NuGet Login
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USERNAME }}

      - name: Restore
        run: dotnet restore Utilis.sln

      - name: Build
        run: dotnet build Utilis.sln -c Release --no-restore /p:ContinuousIntegrationBuild=true

      - name: Pack Utilis
        run: dotnet pack Utilis/Utilis.csproj -c Release --no-build -o artifacts /p:PackageVersion=${{ steps.gitversion.outputs.nuGetVersionV2 }}

      - name: Pack Utilis.Win
        run: dotnet pack Utilis.Win/Utilis.Win.csproj -c Release --no-build -o artifacts /p:PackageVersion=${{ steps.gitversion.outputs.nuGetVersionV2 }}

      - name: Push Packages
        run: dotnet nuget push "artifacts/*.nupkg" --source "https://api.nuget.org/v3/index.json" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --skip-duplicate
