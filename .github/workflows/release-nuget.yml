name: Release NuGet

on:
  workflow_dispatch:

jobs:
  release:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: windows-latest
    permissions:
      id-token: write
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Compute Version
        id: version
        run: |
          $match = Select-String -Path Directory.Build.props -Pattern '<VersionPrefix>([^<]+)</VersionPrefix>'
          if (-not $match) { throw "VersionPrefix not found in Directory.Build.props" }
          $prefix = $match.Matches[0].Groups[1].Value.Trim()
          if ($prefix -notmatch '^\d+\.\d+$') { throw "VersionPrefix must be major.minor (got '$prefix')" }

          git fetch --tags --force
          $max = 0
          foreach ($tag in git tag --list "v$prefix.*") {
            if ($tag -match "^v$([regex]::Escape($prefix))\.(\d+)$") {
              $patch = [int]$Matches[1]
              if ($patch -gt $max) { $max = $patch }
            }
          }
          $version = "$prefix.$($max + 1)"
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Next version: $version"

      - name: NuGet Login
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USERNAME }}

      - name: Restore
        run: dotnet restore Utilis.sln

      - name: Build
        run: dotnet build Utilis.sln -c Release --no-restore /p:ContinuousIntegrationBuild=true /p:Version=${{ steps.version.outputs.version }}

      - name: Pack Utilis
        run: dotnet pack Utilis/Utilis.csproj -c Release --no-build -o artifacts /p:Version=${{ steps.version.outputs.version }}

      - name: Pack Utilis.Win
        run: dotnet pack Utilis.Win/Utilis.Win.csproj -c Release --no-build -o artifacts /p:Version=${{ steps.version.outputs.version }}

      - name: Push Packages
        run: |
          $packages = Get-ChildItem -Path artifacts -Filter *.nupkg
          if (-not $packages) {
            throw "No nupkg files found in artifacts"
          }
          foreach ($package in $packages) {
            dotnet nuget push $package.FullName --source "https://api.nuget.org/v3/index.json" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --skip-duplicate
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Tag release
        run: |
          git tag "v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"
